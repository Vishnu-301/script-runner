name: Run Script

# workflow will request for input
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command(s) to run (separate multiple with &&)"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run script runner
        env:
          COMMAND: ${{ inputs.command }}
        run: npm run start
